name: Ridar briefing

# Runs at 10 minutes past every hour, and on demand from the Actions tab.
# GitHub Actions is free for public repositories.
#
# run.js hashes each country's headlines and skips the AI when nothing has
# changed, so a quiet hour costs nothing — no AI calls, no commit. On a busy
# hour it makes ~4 calls, well inside the Gemini free tier.
#
# Want it calmer? '10 */3 * * *' = every 3 hours.  '10 6 * * *' = once a day.
on:
  schedule:
    - cron: '10 * * * *'
  workflow_dispatch:

# The job commits the generated JSON back into the repo, so it needs write
# permission on contents.
permissions:
  contents: write

# Don't let two hourly runs stack up if one is slow.
concurrency:
  group: ridar-briefing
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 12          # a hung feed can't burn a 6-hour job any more
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Install rss-parser
        run: npm install --no-audit --no-fund

      - name: Fetch, summarise, write data/
        env:
          AI_PROVIDER: ${{ vars.AI_PROVIDER || 'gemini' }}
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          AI_MODEL: ${{ vars.AI_MODEL }}
        run: node run.js

      - name: Commit the new briefing
        run: |
          git config user.name  "ridar-bot"
          git config user.email "actions@github.com"
          git add data/
          # If nothing changed this hour, exit cleanly rather than failing.
          git diff --staged --quiet && echo "No change this hour." && exit 0
          git commit -m "Briefing $(date -u +'%Y-%m-%d %H:%MZ')"
          git push
